<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo Fetch</title>
    <script>
        const URL="https://dummyjson.com/products?limit=5&skip=2"
            
        async function load_product(){
            try{
                const res=await fetch(URL);
                const data=await res.json();
                console.log("DATA",data.products);
                const rows=data.products.map(i=>`<tr>
                    <td>${i.title}</td>
                    <td>${i.category}</td>
                    <td>${i.rating}</td>
                    <td>${i.price}</td>
                    <td>${i.stock}</td>
                </tr>`).join('');
                document.getElementById('data').innerHTML=rows;
            }
            catch(err){
                console.log("Error: ",err)
            }
        }
        load_product()
    </script>
    <style>
        table{
            border:5px solid black;
            width:80%;
        }
    </style>
</head>
<body>
    <table>
        <caption>List of Products</caption>
        <thead>
            <th>Title</th>
            <th>Category</th>
            <th>Rating</th>
            <th>Price </th>
            <th>Stock</th>
        </thead>
        <tbody id="data">
            
        </tbody>
    </table>
</body>
</html>
